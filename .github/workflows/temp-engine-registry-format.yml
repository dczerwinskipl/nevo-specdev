name: Temporary registry formatter
on:
  push:
    branches:
      - feature/specflow-engine-foundation
    paths:
      - .github/workflows/temp-engine-registry-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup
      - name: Format new Engine registry and coordination code
        run: |
          pnpm exec prettier --write packages/specflow-engine/src/project/workspace-registry.ts packages/specflow-engine/src/project/control-lock.ts packages/specflow-engine/src/project/atomic-json.ts packages/specflow-engine/src/project/registry-store.ts packages/specflow-engine/test/workspace-registry.test.ts packages/specflow-engine/test/registry-coordination.test.ts packages/specflow-engine/test/fixtures/registry-worker.test.ts packages/specflow-engine/src/index.ts
      - name: Commit scoped formatting
        shell: bash
        run: |
          git add -- packages/specflow-engine/src/project/workspace-registry.ts packages/specflow-engine/src/project/control-lock.ts packages/specflow-engine/src/project/atomic-json.ts packages/specflow-engine/src/project/registry-store.ts packages/specflow-engine/test/workspace-registry.test.ts packages/specflow-engine/test/registry-coordination.test.ts packages/specflow-engine/test/fixtures/registry-worker.test.ts packages/specflow-engine/src/index.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(engine): format registry and coordination slice"
          git push origin HEAD:feature/specflow-engine-foundation
