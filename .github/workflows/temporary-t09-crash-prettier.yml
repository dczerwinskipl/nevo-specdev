name: Temporary T09 crash-test formatting proof

on:
  push:
    branches: [feature/specflow-engine-foundation]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Capture exact Prettier output
        run: |
          pnpm exec prettier --write packages/specflow-engine/test/create-crash-recovery.test.ts
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'packages/specflow-engine/test/create-crash-recovery.test.ts';
          const value = fs.readFileSync(p).toString('base64');
          console.log('CAPTURE_BEGIN ' + p);
          for (let i = 0; i < value.length; i += 1024) console.log('CAPTURE_DATA ' + value.slice(i, i + 1024));
          console.log('CAPTURE_END ' + p);
          NODE
