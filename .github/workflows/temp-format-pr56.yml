name: Temporary formatting verification PR56
on:
  push:
    branches:
      - docs/ideas-deterministic-multi-instance-review
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Format two Markdown files and emit verified content
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          for i in docs/ideas/specflow-engine/multi-instance-execution.md docs/ideas/specflow-engine/multi-instance-plan/README.md; do
            pnpm exec prettier --write "$i"
            echo "FORMAT_BEGIN=$i"
            base64 -w0 "$i"
            echo
            echo "FORMAT_END=$i"
          done
