name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/v*"

# Superseded PR runs are cancelled; main / release pushes always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # On a PR, scope package tasks to what changed since the base; elsewhere run everything.
  # A shallow checkout would make every package look affected — checkout uses fetch-depth: 0.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # The same canonical script contributors run locally: format:check, lint,
      # docs validation/index freshness, and the version.json transition gate.
      - name: Quality gate
        run: pnpm check:quality

      - name: Resolved version
        run: pnpm version:print

      # Package-scoped — affected on PRs, full on main / release.
      - name: Affected packages
        run: pnpm exec turbo run typecheck test build ${{ env.AFFECTED }} --dry=text
      - name: Typecheck
        run: pnpm exec turbo run typecheck ${{ env.AFFECTED }}

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Test
        run: pnpm exec turbo run test ${{ env.AFFECTED }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm exec turbo run build ${{ env.AFFECTED }}
