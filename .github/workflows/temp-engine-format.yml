# Temporary migration job. Remove after the existing Plan docs have been formatted.
name: Temporary Engine docs formatter
on:
  push:
    branches:
      - feature/specflow-engine-foundation
    paths:
      - .github/workflows/temp-engine-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: ./.github/actions/setup
      - name: Format inherited Engine documentation
        run: pnpm exec prettier --write docs/ideas/specflow-engine
      - name: Commit only formatted documentation
        shell: bash
        run: |
          git add -- docs/ideas/specflow-engine
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(docs): format Engine plans for Quality gate"
          git push origin HEAD:feature/specflow-engine-foundation
