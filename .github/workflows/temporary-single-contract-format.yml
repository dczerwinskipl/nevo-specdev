name: Temporary single-contract format capture

on:
  push:
    branches: [feature/specflow-engine-foundation]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Format and capture exact pinned Prettier output
        shell: bash
        run: |
          pnpm exec prettier --write "docs/ideas/specflow-engine/acceptance-criteria.md" "docs/ideas/specflow-engine/execution-plans/02-specifications-git-workspaces/README.md" "docs/ideas/specflow-engine/specification-close-decisions.md" "docs/ideas/specflow-engine/specification-close-self-review.md" "docs/ideas/specflow-engine/test-plan.md" "packages/specflow-engine/src/specs/create/journal-codec.ts" "packages/specflow-engine/src/specs/durable-create.ts" "packages/specflow-engine/src/specs/repository.ts" "packages/specflow-engine/test/create-journal-contract.test.ts"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const candidates = ["docs/ideas/specflow-engine/acceptance-criteria.md","docs/ideas/specflow-engine/execution-plans/02-specifications-git-workspaces/README.md","docs/ideas/specflow-engine/specification-close-decisions.md","docs/ideas/specflow-engine/specification-close-self-review.md","docs/ideas/specflow-engine/test-plan.md","packages/specflow-engine/src/specs/create/journal-codec.ts","packages/specflow-engine/src/specs/durable-create.ts","packages/specflow-engine/src/specs/repository.ts","packages/specflow-engine/test/create-journal-contract.test.ts"];
          const changed = candidates;
          for (const path of changed) {
            const encoded = fs.readFileSync(path).toString('base64');
            console.log('FORMAT_BEGIN ' + path);
            for (let i = 0; i < encoded.length; i += 1024) {
              console.log('FORMAT_DATA ' + encoded.slice(i,i+1024));
            }
            console.log('FORMAT_END ' + path);
          }
          NODE
