name: Temporary single-contract documentation regeneration

on:
  push:
    branches: [feature/specflow-engine-foundation]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Generate canonical documentation index and format
        shell: bash
        run: |
          pnpm docs:check --write
          pnpm exec prettier --write "docs/ideas/specflow-engine/specification-and-worktree-close-design.md"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files = ["docs/index.generated.json","docs/index.generated.md","docs/ideas/specflow-engine/specification-and-worktree-close-design.md"];
          for (const path of files) {
            const data = fs.readFileSync(path).toString('base64');
            console.log('INDEX_BEGIN ' + path);
            for (let i = 0; i < data.length; i += 1024) {
              console.log('INDEX_DATA ' + data.slice(i,i+1024));
            }
            console.log('INDEX_END ' + path);
          }
          NODE
