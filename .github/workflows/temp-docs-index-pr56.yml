name: Temporary PR56 docs index diagnosis
on:
  push:
    branches:
      - docs/ideas-deterministic-multi-instance-review
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Determine exact docs index change
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm docs:check --write
          pnpm docs:check
          echo 'DOCS_INDEX_DIFF_BEGIN'
          git diff --text --no-ext-diff --unified=2 -- docs/index.generated.json
          echo 'DOCS_INDEX_DIFF_END'
