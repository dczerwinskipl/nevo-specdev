name: Temporary docs index regeneration

on:
  push:
    branches: [feature/specflow-engine-foundation]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/specflow-engine-foundation
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Generate exactly the canonical docs index
        shell: bash
        run: |
          pnpm docs:check --write
          git add -- docs/index.generated.json docs/index.generated.md
          if git diff --cached --quiet; then
            echo "Index already fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(engine): regenerate canonical documentation index"
          git push origin HEAD:refs/heads/feature/specflow-engine-foundation
